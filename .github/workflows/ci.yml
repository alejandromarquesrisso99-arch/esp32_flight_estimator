name: Continuous Integration & Firmware Build

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Pruebas Unitarias de Matemáticas, EKF y Protocolo (PC)
  # -------------------------------------------------------------
  host-unit-tests:
    name: Host Unit Tests (C++17 / CTest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build

      - name: Configure CMake Test Suite
        run: |
          cmake -B build_test -S test -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build All Unit Tests
        run: |
          cmake --build build_test

      - name: Execute Test Suite (Matrix, EKF 7D, Protocol & FDIR)
        run: |
          ctest --test-dir build_test --output-on-failure --verbose

  # -------------------------------------------------------------
  # Job 2: Compilación y Empaquetado del Firmware ESP-IDF (ESP32)
  # -------------------------------------------------------------
  esp32-firmware-build:
    name: ESP-IDF Firmware Build (ESP32 / v5.3.1)
    runs-on: ubuntu-latest
    needs: [host-unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build ESP32 Firmware with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32
          path: '.'

      - name: Package Firmware Binaries
        if: success()
        run: |
          mkdir -p release_binaries
          cp build/bootloader/bootloader.bin release_binaries/
          cp build/partition_table/partition-table.bin release_binaries/
          cp build/esp32_flight_estimator.bin release_binaries/
          cp build/flasher_args.json release_binaries/ || true

      - name: Upload Firmware Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-flight-estimator-binaries
          path: release_binaries/
          retention-days: 14
